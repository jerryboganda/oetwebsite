name: Build & Verify

on:
  push:
    branches: [main, master, 'overhaul/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build (dist only, no root copy)
        working-directory: site
        run: npm run build:ci

      - name: Verify build output
        working-directory: site
        run: npm run verify

      - name: Check committed root pages match build output
        working-directory: site
        # The repo root is the deployable webroot; committed pages must equal
        # what the current sources build. Guards against hand-editing root HTML.
        run: node scripts/postbuild.mjs --check-root

  # §1 acceptance: the promotional CTA image/card must never cover the footer or
  # any content below it. Runs the real pages in both engines (chromium covers
  # Chrome + Edge; webkit covers Safari) across phone → desktop widths, and both
  # orientations at phone widths. See site/scripts/check-cta-overlap.mjs.
  cta-overlap:
    name: CTA/footer overlap (chromium + webkit, 320→1920px)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build site (dist only)
        working-directory: site
        # Validate the real deployable artifact (built from src/), not the stale
        # committed root mirror that postbuild --check-root already flags as drift.
        run: npm run build:ci

      - name: Install Playwright browsers
        working-directory: site
        run: npx playwright install --with-deps chromium webkit

      - name: Check the CTA banner never overlaps the footer
        id: cta
        working-directory: site
        # --root dist: the §1 fix lives in src/ -> dist; the committed root pages
        # are a known-stale mirror and must not be the acceptance target.
        run: |
          set -o pipefail
          node scripts/check-cta-overlap.mjs --root dist 2>&1 | tee -a "$RUNNER_TEMP/cta-overlap.log"

      - name: Upload CTA overlap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cta-overlap-report
          path: ${{ runner.temp }}/cta-overlap.log
          if-no-files-found: warn
          retention-days: 3
