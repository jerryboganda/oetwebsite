        "name": "What is OET@Home?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "OET@Home is the full OET test taken at home on your own computer with remote proctoring. It is one of three delivery modes, next to the OET Test on Paper and the OET Test on Computer at a venue, and it has the same content, timing and marking."

        "@type": "Question",
        "name": "Can I take OET@Home from any country?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. OET offers OET@Home where taking the test at a venue is not yet available, or as an exception approved case by case. OET publishes no country list, so check the official booking tool for your city. If your country has a test venue, plan to sit at a venue."
        }
      },
      {
        "@type": "Question",
        "name": "Which professions can take OET@Home?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The official sources disagree. OET's own page lists all 12 professions, while the Cambridge English overview lists four: Medicine, Nursing, Pharmacy and Physiotherapy. Check your profession in the booking tool before you rely on OET@Home."
        }
      },
      {
        "@type": "Question",
        "name": "Which regulators accept OET@Home?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "On their own pages, the GMC and the NMC accept it, and ECFMG accepts it only when your country has no physical test venue. CORU says at-home versions are accepted for OET without naming OET@Home, so we list it as not confirmed. The GPhC, NMBI, the Medical Council of Ireland, the PSI, Ahpra, the Australian Department of Home Affairs, the Nursing Council of New Zealand, TruMerit, NABP and BCCNM do not. For many others it is not confirmed, so ask your regulator in writing."
        }
      },

        "@type": "Question",
        "name": "Is online Speaking the same as OET@Home?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. On the OET Test on Computer you sit Listening, Reading and Writing at a venue, and Speaking may be taken at home or at a venue depending on the country. That is still a venue-based test. OET@Home means all four sub-tests are taken at home."
        }
      },
