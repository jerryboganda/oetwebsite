        "@type": "Question",
        "name": "What should the last paragraph of an OET discharge letter include?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "State what the reader should do and when, mention any follow-up that is already arranged, refer to the education the patient received if the reader needs to reinforce it, and say when the reader or patient should seek help. Then add a short courtesy sentence offering further information."
        }
      },
      {
        "@type": "Question",
        "name": "Should the request go at the start or the end of a discharge letter?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Both. OET's guidance on Purpose says the reason for writing should be immediately apparent and then expanded later in the letter. State the purpose and the main request in the opening paragraph, then give the detailed actions in the final paragraph."
        }
      },
      {
        "@type": "Question",
        "name": "Do I need to include warning signs in a nursing discharge letter?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Include warning signs when the case notes give them and the reader or patient needs to act on them. Say what the sign is and what should happen next, such as contacting the GP or the ward, rather than listing symptoms on their own."
        }
      },
      {
        "@type": "Question",
        "name": "How do I know whether the reader already knows the patient?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Read the task instructions carefully. OET points out that job titles such as community nurse or family doctor do not, on their own, mean the reader knows the patient. If there is no clear sign of an existing relationship, give brief relevant background."
        }
      },
      {
        "@type": "Question",
        "name": "Does the closing sentence count towards the 180 to 200 words?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. OET says only the body paragraphs count, so the address, date, greeting, reference line, closing sentence and sign-off are not included. Assessors do not count your words, but the on-screen counter in computer and OET@Home tests counts everything you type."
        }
