        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Not by cancelling, because a cancellation fee always applies. OET issues a full refund if it cannot deliver your test because of circumstances outside its control and there are no suitable new dates."
        }
      },

        "@type": "Question",
        "name": "What happens if I miss my OET exam?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "You are not eligible for a refund unless you can show extenuating circumstances. You have five business days to contact OET Support with evidence, and each case is assessed individually."
        }
      },

        "@type": "Question",
        "name": "Can I cancel just one OET sub-test?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. You must cancel your whole booking. Partial cancellations are not allowed."
        }

        "@type": "Question",
