        "@type": "Question",
        "name": "What does OET stand for?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "OET stands for Occupational English Test. It is an English language test designed for healthcare professionals and is offered for 12 professions."
        }
      },
      {
        "@type": "Question",
        "name": "Is OET only for doctors and nurses?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. OET covers 12 professions: Medicine, Nursing, Dentistry, Dietetics, Occupational Therapy, Optometry, Pharmacy, Physiotherapy, Podiatry, Radiography, Speech Pathology and Veterinary Science."
        }
      },
      {
        "@type": "Question",
        "name": "How long is the OET exam?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Listening takes about 40 minutes, Reading 60 minutes and Writing 45 minutes, so about two and a half hours together. Speaking takes about 20 minutes and, on computer, is usually on a different day."
        }
      },
      {
        "@type": "Question",
        "name": "What is the passing score for OET?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "There is no single pass mark because each regulator sets its own. Most ask for grade B, which is 350 out of 500, in each sub-test. Several accept 300 in Writing, and Ahpra asks for more in Reading and Speaking."
        }
      },
      {
        "@type": "Question",
        "name": "Is OET easier than IELTS?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Many healthcare professionals find OET more familiar because the tasks are clinical, but it is still a high-level English exam. OET grade B at 350 to 390 compares with IELTS 7.0 in OET's published benchmarking."
        }
      },
      {
        "@type": "Question",
        "name": "How long are OET results valid?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "OET itself sets no validity period. Each regulator decides how old a result can be, and two years is common."
        }
