        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes for some professions. On 27 November 2026 the Singapore Medical Council, the Singapore Pharmacy Council, the Singapore Dental Council and the Allied Health Professions Council all listed OET as English evidence for foreign-trained applicants who need it. The Singapore Nursing Board page for foreign-trained nurses lists no English test at all."

        "@type": "Question",
        "name": "Do nurses need OET for Singapore?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The Singapore Nursing Board page for foreign-trained nurses and midwives does not list OET or any other English test. It asks for a job offer from an eligible healthcare institution, your nursing qualification and your registration in the country where you trained. Whether an employer asks for an English test is not confirmed, so ask your employer before you book OET."
        }
      },
      {
        "@type": "Question",
        "name": "What OET score do doctors need for the Singapore Medical Council?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The Singapore Medical Council asks for at least Grade B in each of the four components, obtained in a single sitting. The result is accepted only within 2 years from the date of the test. The rule applies to international medical graduates whose basic degree is from a school where English is not the medium of instruction."
        }
      },
      {
        "@type": "Question",
        "name": "What OET score do pharmacists need for the Singapore Pharmacy Council?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The Singapore Pharmacy Council asks for OET Pharmacy with at least 350 in each of the four components, obtained at one sitting, within 2 years before the date you apply for pre-registration training. The rule applies to graduates whose pharmacy degree is from outside the UK, USA, Canada, Australia and New Zealand."
        }
      },

        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Not confirmed. None of the four council pages we read mentions OET@Home or any delivery format for OET, apart from a note in the allied health table that computer-based testing is also accepted for Physiotherapy. Ask your council in writing before you book an at-home test."
        }
      },

        "@type": "Question",
        "name": "Can I combine two OET sittings for Singapore?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. The four councils that list OET all ask for the required scores in a single sitting. The Allied Health Professions Council sets no limit on the number of attempts, but each attempt must reach every score on its own."
        }
