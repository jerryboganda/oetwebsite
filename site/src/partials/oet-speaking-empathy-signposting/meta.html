        "acceptedAnswer": {
          "@type": "Answer",

        "name": "Which OET criteria cover empathy and signposting?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Empathy sits under Relationship-building, and picking up cues sits under Understanding and incorporating the patient perspective. Signposting changes in topic is part of Providing structure. All are clinical communication criteria scored from 0 to 3."

        "name": "Can I write notes on the role-play card?",
        "acceptedAnswer": {
          "@type": "Answer",
