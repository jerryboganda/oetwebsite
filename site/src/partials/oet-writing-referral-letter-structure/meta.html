        "acceptedAnswer": {

        "name": "How do I decide which case notes to leave out?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Ask whether the reader needs the note to act on your request or to care for the patient safely. If the answer is no, because it is unrelated, normal, resolved or already known to the reader, leave it out."
        }

        "name": "Should a referral letter be in chronological order?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Only when the timeline itself is what the reader needs. If the current problem matters most, group information by theme, starting with the problem now, then what has been tried, then relevant background."
