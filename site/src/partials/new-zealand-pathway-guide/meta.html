        "name": "What OET score do nurses need for New Zealand?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The Nursing Council of New Zealand asks for at least 350 in Reading, Listening and Speaking and at least 300 in Writing. The scores can come from more than one sitting, but all of them must be reached within 12 months of your first sitting."
        }
      },

        "@type": "Question",

        "acceptedAnswer": {
          "@type": "Answer",

        }
      },

        "@type": "Question",
        "name": "Does New Zealand accept OET@Home?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "It depends on the authority. The Nursing Council does not accept OET@Home, but it accepts OET on computer at a venue with the Speaking sub-test hosted online. The Optometrists and Dispensing Opticians Board accepts tests taken in person only. Immigration New Zealand does not accept at-home tests. For the other authorities it is not confirmed, so ask in writing before you book."
        }

          "@type": "Answer",

        }
