        "@type": "Question",
        "name": "What is OET clubbing?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Clubbing means using the results of two OET sittings together to meet a regulator's score requirement. OET does not decide whether it is allowed: each regulator sets its own rule, and many accept one sitting only."
        }
      },
      {
        "@type": "Question",
        "name": "Which regulators allow OET clubbing?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "On the pages we read on 27 November 2026, the NMC, Ahpra and ANMAC publish two-sitting rules. So do CORU in Ireland and, in New Zealand, the Medical Council, the Nursing Council, the Pharmacy Council, the Physiotherapy Board and the Occupational Therapy Board. Each one sets different conditions."
        }
      },
      {
        "@type": "Question",
        "name": "Can I combine two OET results for the GMC?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. The GMC asks for at least grade B in each of the four areas in the same test, from your most recent sitting."
        }
      },
      {
        "@type": "Question",
        "name": "How far apart can the two sittings be?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "It depends on the regulator. The NMC, Ahpra, ANMAC and the Medical Council of New Zealand use a 12-month window. CORU and the Physiotherapy Board of New Zealand use six months."
        }
      },
      {
        "@type": "Question",
        "name": "Can I retake only one OET sub-test?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "OET lets you book fewer than four sub-tests after a first full test, but most regulators do not accept the result. The NMC, Ahpra, ANMAC, the Medical Council of New Zealand and CORU want all four sub-tests in every sitting. The HCPC is the only regulator we found that accepts a retake of one element, within six months of the original test."
        }
      },
      {
        "@type": "Question",
        "name": "Does OET issue one certificate for two sittings?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "This is not confirmed. OET's published pages do not say that it merges two sittings into one Statement of Results. Our reading is that each sitting keeps its own Statement of Results and the regulator does the combining. Confirm this with your regulator."
        }
      },
      {
        "@type": "Question",
        "name": "Can I combine an OET sitting with an IELTS sitting?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "We found no regulator that allows it. The NMC, Ahpra, ANMAC, CORU and the Nursing Council of New Zealand all say both results must come from the same test."
        }
      },
      {
        "@type": "Question",
        "name": "Does OET@Home count in a combined result?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "For the NMC, yes: it accepts OET@Home and lets you combine it with a paper or computer sitting. Ahpra, ANMAC and the Nursing Council of New Zealand do not accept OET@Home at all."
