        "name": "Will the interlocutor really act angry in an OET Speaking role-play?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sometimes. OET says you may experience anxious or angry patients in the role-plays, as in real healthcare settings. Stay calm, acknowledge the emotion and keep the conversation structured, as you would at work."
        }
      },
      {
        "@type": "Question",
        "name": "Which OET criteria does handling an angry patient affect?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Mostly the five clinical communication criteria: Relationship-building, Understanding and incorporating the patient's perspective, Providing structure, Information-gathering and Information-giving, each marked out of 3. Tone and register also count under the linguistic criterion Appropriateness of Language."
        }
      },
      {
        "@type": "Question",
        "name": "Should I apologise to an angry patient in OET Speaking?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A short, sincere apology for the person's experience is appropriate, for example that nobody told them about a delay. Avoid blaming colleagues or apologising repeatedly. Then move on to explaining what happened and what happens next."
        }
      },
      {
        "@type": "Question",
        "name": "What if the patient is still upset and I run out of time?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "OET says there is no penalty for not completing all the elements on the role card. Keep acknowledging, explaining and agreeing a next step. A calm, structured conversation gives better evidence of your skills than rushing through every task."
        }
      },
      {
        "@type": "Question",
        "name": "How is an anxious patient different from an angry one?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "An anxious patient usually needs a slower pace, shorter explanations and more checking of understanding. An angry patient usually needs their frustration acknowledged before they can listen. In both cases, find the worry underneath and relate your explanation to it."
        }
