    <script id="oet-pricing-hero-slider-script">
        document.addEventListener('DOMContentLoaded', function () {
            var slider = document.querySelector('.oet-pricing-hero-swiper');
            if (!slider || typeof Swiper === 'undefined') return;

            var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            var heroSwiper = new Swiper(slider, {
                loop: true,
                speed: reduceMotion ? 0 : 620,
                grabCursor: true,
                slidesPerView: 1,
                spaceBetween: 0,
                effect: 'slide',
                roundLengths: true,
                preloadImages: true,
                updateOnImagesReady: true,
                observer: true,
                observeParents: true,
                autoplay: reduceMotion ? false : {
                    delay: 3000,
                    disableOnInteraction: false,
                    pauseOnMouseEnter: true
                },
                pagination: {
                    el: '.oet-pricing-hero-pagination',
                    clickable: true
                },
                navigation: {
                    nextEl: '.oet-pricing-hero-nav--next',
                    prevEl: '.oet-pricing-hero-nav--prev'
                }
            });

            slider.addEventListener('mouseenter', function () {
                if (heroSwiper.autoplay) heroSwiper.autoplay.stop();
            });
            slider.addEventListener('mouseleave', function () {
                if (heroSwiper.autoplay && !reduceMotion) heroSwiper.autoplay.start();
            });
        });
    </script>

    <script id="oet-pricing-collapse-script">
        // Phones only (CSS hides the toggle at 768px+): collapse long package cards.
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.oet-pricing-card').forEach(function (card) {
                var list = card.querySelector(':scope > ul');
                var hidden = (list ? Math.max(list.children.length - 3, 0) : 0) + (card.querySelector('.oet-pricing-desc') ? 1 : 0);
                if (!list || !hidden) return;
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'oet-pricing-more';
                btn.setAttribute('aria-expanded', 'false');
                var label = document.createElement('span');
                var more = list.children.length > 3 ? 'See all ' + list.children.length + ' inclusions' : 'See full details';
                label.textContent = more;
                var icon = document.createElement('i');
                icon.className = 'fa-solid fa-angle-down';
                icon.setAttribute('aria-hidden', 'true');
                btn.append(label, icon);
                btn.addEventListener('click', function () {
                    var open = card.classList.toggle('is-expanded');
                    btn.setAttribute('aria-expanded', String(open));
                    label.textContent = open ? 'Show less' : more;
                    // collapsing a long card must not strand the reader below it
                    if (!open && card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: 'start' });
                });
                list.after(btn);
                card.classList.add('is-collapsible');
            });
        });
    </script>

    <script id="oet-candidates-app-detection-script">
        document.addEventListener('DOMContentLoaded', function () {
            var section = document.getElementById('download-app');
            if (!section) return;

            var cards = section.querySelectorAll('.oet-app-card');
            var primaryBtn = document.getElementById('oet-download-cta-btn');
            var primaryText = document.getElementById('oet-download-cta-text');

            var platformMap = {
                android: {
                    name: 'Android',
                    url: 'https://app.oetwithdrhesham.co.uk/get-app/android-install'
                },
                ios: {
                    name: 'iPhone / iPad',
                    url: 'https://app.oetwithdrhesham.co.uk/get-app'
                },
                windows: {
                    name: 'Windows',
                    url: 'https://app.oetwithdrhesham.co.uk/api/download/windows'
                },
                mac: {
                    name: 'macOS',
                    // 17 Sep 2026: Mac download temporarily disabled (release QA) —
                    // route Mac visitors to /get-app, which shows the Web-App
                    // direction, instead of the disabled resolver.
                    url: 'https://app.oetwithdrhesham.co.uk/get-app'
                }
            };

            function detectPlatform() {
                var ua = navigator.userAgent || '';
                var platform = navigator.platform || '';
                var maxTouchPoints = navigator.maxTouchPoints || 0;

                if (/Android/i.test(ua)) return 'android';
                if (/iPad|iPhone|iPod/i.test(ua) || (/Macintosh/i.test(platform) && maxTouchPoints > 1)) return 'ios';
                if (/Macintosh|Mac OS X/i.test(ua)) return 'mac';
                if (/Win/i.test(platform) || /Windows/i.test(ua)) return 'windows';
                return 'windows'; // default fallback
            }

            function selectPlatform(targetPlatform, isUserClick) {
                var data = platformMap[targetPlatform];
                if (!data) return;

                cards.forEach(function (card) {
                    var p = card.getAttribute('data-platform');
                    if (p === targetPlatform) {
                        card.classList.add('is-active');
                        if (!isUserClick) {
                            card.classList.add('is-recommended');
                        }
                    } else {
                        card.classList.remove('is-active');
                        if (isUserClick) {
                            // keep recommended badge on the original detected OS if user clicked another
                        }
                    }
                });

                if (primaryBtn) {
                    primaryBtn.href = data.url;
                    primaryBtn.setAttribute('aria-label', 'Download the Candidates App for ' + data.name);
                }
                if (primaryText) {
                    primaryText.textContent = 'Download the Candidates App';
                }
            }

            var detected = detectPlatform();
            selectPlatform(detected, false);

            cards.forEach(function (card) {
                card.addEventListener('click', function (e) {
                    var p = card.getAttribute('data-platform');
                    if (p) {
                        selectPlatform(p, true);
                    }
                });
            });
        });
    </script>
