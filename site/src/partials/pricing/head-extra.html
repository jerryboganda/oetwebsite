    <style id="oet-pricing-conversion-css">
        .oet-enroll-band { background: linear-gradient(160deg, #f4f0ff 0%, #ffffff 60%, #eefcf7 100%); border-block: 1px solid rgba(101, 66, 255, .1); padding: 56px 0 48px; }
        .oet-enroll-head { text-align: center; max-width: 720px; margin: 0 auto 34px; }
        .oet-enroll-head h2 { color: #191829; font-size: clamp(26px, 3.2vw, 38px); margin: 0 0 10px; }
        .oet-enroll-head p { color: #4f5060; margin: 0; }
        .oet-enroll-steps { list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; padding: 0; margin: 0 0 30px; }
        .oet-enroll-steps li { position: relative; background: #fff; border: 1px solid rgba(101, 66, 255, .14); border-radius: 18px; padding: 24px 22px 22px; box-shadow: 0 14px 34px rgba(44, 34, 110, .07); }
        .oet-step-num { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; background: linear-gradient(135deg, #6542ff, #7b61ff); color: #fff; font-weight: 900; font-size: 17px; margin-bottom: 14px; }
