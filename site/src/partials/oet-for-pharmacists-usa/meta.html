        "name": "Does NABP accept OET for pharmacists?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes, from 11 January 2027. NABP will accept OET for Pharmacy as an alternative to TOEFL iBT for FPGEC Certification, for candidates applying to sit the FPGEE in 2027 and later. Only tests taken on or after 11 January 2027 count."
        }
      },
      {
        "@type": "Question",
        "name": "What OET score does NABP require?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "NABP has not published the OET minimum scores yet. It said they would be published by the end of November 2026, and none was on its website when we checked on 27 November 2026. Do not rely on any number until NABP publishes it."
        }
      },
      {
        "@type": "Question",
        "name": "Can I use an OET Pharmacy result from 2026?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. NABP says OET results from tests taken before 11 January 2027 will not be accepted, even if the application is submitted after that date."
        }
      },
      {
        "@type": "Question",
        "name": "Does NABP accept OET@Home?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. NABP does not accept home edition scores for OET or TOEFL iBT. The OET must be taken on computer at an approved test centre."
        }
      },
      {
        "@type": "Question",
        "name": "Can I take OET in Egypt, Saudi Arabia or the UAE for FPGEC?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Not under the rule as the NABP bulletin writes it. The test centre must be in an NABP member or associate member jurisdiction: the 50 US states, the District of Columbia, Guam, Puerto Rico, the Virgin Islands or one of 10 Canadian provinces. This is our reading of the bulletin, so confirm with NABP before you book."
        }
      },
      {
        "@type": "Question",
        "name": "Do I need both OET and TOEFL iBT?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Either test meets the requirement. OET does not replace TOEFL iBT, which NABP still accepts, and there are no waivers for native English speakers or US citizens."
        }
      },
      {
        "@type": "Question",
        "name": "Does NABP accept TOEFL MyBest scores?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes, from 1 November 2026, for the 2027 FPGEE administration. Without MyBest, all four TOEFL iBT sections must be passed in one testing session."
        }
      },

        "@type": "Question",
